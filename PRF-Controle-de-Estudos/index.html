<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1f3a"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>PRF | Controle de Estudos</title>
<style>*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#eef1f6;color:#0b1f3a}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}nav{background:#0b1f3a;color:#fff;padding:14px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
nav h1{font-size:15px;margin:4px 8px 14px}nav h1 small{display:block;color:#f5b800;font-weight:500;font-size:11px}
nav button{background:none;border:0;color:#cfd8e6;text-align:left;padding:10px 12px;border-radius:10px;font:inherit;min-height:46px}nav button.on{background:#17325c;color:#fff;box-shadow:inset 3px 0 #f5b800}
main{padding:18px 22px;overflow:auto}h2{margin:0 0 12px;font-size:21px}h3{margin:18px 0 8px}.m{color:#51607a;margin-top:0}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.c{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 3px #0b1f3a14}.c b.n{display:block;font-size:26px}.c small,.c span{color:#51607a}
.bar{height:9px;background:#e3e8f1;border-radius:6px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:#1f5fbf}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid #e3e8f1;text-align:left;vertical-align:top}
input,select,textarea,button.b{font:inherit;padding:10px;border:1px solid #c5cfdf;border-radius:10px;min-height:44px;background:#fff;color:#0b1f3a;max-width:100%}.w{width:100%}
button.b{background:#1f5fbf;color:#fff;border:0;cursor:pointer}button.s{background:#e3e8f1;color:#0b1f3a}button.r{background:#c0392b}button:disabled{opacity:.5}
label{display:block;font-size:12px;color:#51607a;margin:8px 0 3px}.row{display:flex;gap:4px;margin-top:6px;align-items:center}.row span,.row input{flex:1;min-width:0}
.w7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.w7 .c{padding:8px;font-size:12px}.chip{display:inline-block;background:#fff3c4;border-radius:8px;padding:3px 8px;font-size:12px;margin:2px 3px 2px 0}
.cols{display:flex;align-items:flex-end;gap:5px;height:130px;margin:10px 0 36px}.cols div{flex:1;background:#1f5fbf;border-radius:4px 4px 0 0;min-height:2px;position:relative}.cols span{position:absolute;top:100%;left:-4px;right:-4px;text-align:center;font-size:9px;color:#51607a;line-height:1.2;margin-top:3px}
#t{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0b1f3a;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:9}#t.show{opacity:1}
#u{position:fixed;top:10px;right:10px;background:#fff3c4;padding:10px 14px;border-radius:12px;z-index:9}
@media(max-width:820px){.app{grid-template-columns:1fr}nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow:auto;z-index:5;padding:6px}nav h1{display:none}nav button{white-space:nowrap;padding:8px 12px}main{padding:14px 14px 84px}.w7{grid-template-columns:1fr 1fr}}</style></head>
<body><div class=app><nav><h1>PRF | Controle de Estudos<small>uso pessoal · não oficial</small></h1>
<button data-v=inicio onclick="A.show('inicio')">Início</button><button data-v=cron onclick="A.show('cron')">Cronograma</button><button data-v=mat onclick="A.show('mat')">Matérias</button><button data-v=reg onclick="A.show('reg')">Registrar estudo</button><button data-v=hist onclick="A.show('hist')">Histórico</button><button data-v=est onclick="A.show('est')">Estatísticas</button><button data-v=cfg onclick="A.show('cfg')">Backup e config.</button></nav>
<main><section id=v-inicio hidden></section><section id=v-cron hidden></section><section id=v-mat hidden></section><section id=v-reg hidden></section><section id=v-hist hidden></section><section id=v-est hidden></section><section id=v-cfg hidden></section></main></div>
<div id=t></div><div id=u hidden>Nova versão disponível <button class=b onclick="A.upd()">Atualizar</button></div>
<script src="core.js"></script><script src="app.js"></script></body></html>
